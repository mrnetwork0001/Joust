name: joust
version: "0.1.0"
description: "Parallel Git-worktree subagent arena, deterministic benchmark judge, and 1-click winner merge studio for Hermes."
author: "mrnetwork"
license: MIT
requires_hermes: ">=0.22.5"
homepage: https://github.com/mrnetwork0001/Joust
tags: [coding, git, subagents, benchmark, desktop]
provides_tools:
  - joust_launch
  - joust_evaluate
  - joust_diff
  - joust_steer
  - joust_merge
  - joust_status
  - joust_crossfire
  - joust_report
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
provides_middleware:
  - tool_request
emits:
  - bout.updated
config_schema:
  default_timeout_seconds:
    type: int
    default: 60
    label: "Benchmark Timeout (s)"
    description: "Maximum seconds allowed for each contender's verification/benchmark command."
  auto_evaluate_on_stop:
    type: bool
    default: true
    label: "Auto-Judge on Subagent Stop"
    description: "Automatically run the bout verification command when a contender subagent finishes."
  keep_backup_patches:
    type: bool
    default: true
    label: "Save Rollback Patches Before Merge"
    description: "Save a reversible git patch under plugin-data/joust/backups before merging a winning contender."
